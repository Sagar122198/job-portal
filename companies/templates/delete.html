{% extends "base.html" %}

{% block title %}Delete Job{% endblock %}

{% block body %}
<main class="min-h-screen bg-gray-50 flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 sm:p-8 text-center">
            <!-- Warning Icon -->
            <div class="mx-auto flex items-center justify-center h-14 w-14 rounded-full bg-red-100 mb-5">
                <svg class="h-7 w-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <h1 class="text-xl font-bold text-gray-900 mb-2">Delete this job?</h1>
            <p class="text-sm text-gray-500 mb-6 leading-relaxed">
                Are you sure you want to delete <strong class="text-gray-700">{{ job.job_title }}</strong>? This action cannot be undone and all associated applications will be removed.
            </p>

            <div class="flex flex-col sm:flex-row justify-center gap-3">
                <a href="{% url 'company:jobs' %}" class="inline-flex items-center justify-center px-5 py-2.5 bg-gray-100 text-gray-700 font-semibold text-sm rounded-xl hover:bg-gray-200 transition order-2 sm:order-1">
                    Cancel
                </a>
                <form method="post" class="order-1 sm:order-2">
                    {% csrf_token %}
                    <button type="submit" class="w-full inline-flex items-center justify-center px-5 py-2.5 bg-red-600 text-white font-semibold text-sm rounded-xl hover:bg-red-700 transition shadow-sm">
                        Yes, Delete Job
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
