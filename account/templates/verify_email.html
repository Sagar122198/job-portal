{% extends "base.html" %}
{% block title %}Verify your email{% endblock %}
{% block body %}
<main class="flex-grow bg-slate-50 py-16"><div class="mx-auto max-w-md px-4"><section class="rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-blue-50 text-xl text-blue-600">✉</div><h1 class="mt-5 text-2xl font-bold text-slate-900">Verify your email</h1><p class="mt-2 text-sm leading-6 text-slate-500">We sent a 6-digit code to <strong class="text-slate-700">{{ email }}</strong>. Enter it below to activate your account.</p><form method="post" class="mt-7">{% csrf_token %}<label for="code" class="sr-only">Verification code</label><input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required class="w-full rounded-xl border border-slate-200 px-4 py-3 text-center text-2xl font-bold tracking-[0.5em] outline-none focus:border-blue-600 focus:ring-4 focus:ring-blue-100" placeholder="000000"><button type="submit" class="mt-4 w-full rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700">Verify email</button></form><form method="post" action="{% url 'account:resend_otp' %}" class="mt-5">{% csrf_token %}<button type="submit" class="text-sm font-semibold text-blue-600 hover:underline">Resend code</button></form></section></div></main>
{% endblock %}
