# render.yaml — Infrastructure-as-Code for Render
# Place this file at the repo root.  When you connect your GitHub repo,
# Render reads this file and creates the services automatically.

services:
  - type: web
    name: job-portal
    runtime: docker                       # tells Render to use the Dockerfile
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: job_portal.settings_prod
      - key: SECRET_KEY
        generateValue: true               # Render auto-generates a strong key
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: job-portal-db
          property: connectionString
      - key: CLIENT_ID
        sync: false                        # you fill this in manually on dashboard
      - key: CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: job-portal-db
    plan: free
    databaseName: job_portal
    user: job_portal_user
